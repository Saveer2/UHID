<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor registration · UHID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/global.css">
<link rel="stylesheet" href="../styles/image-viewer.css">
<link rel="stylesheet" href="../styles/medical-records.css">
<link rel="stylesheet" href="../styles/professional.css">
<link rel="stylesheet" href="../styles/register.css">
<link rel="stylesheet" href="../styles/security.css">
</head>
<body>
<div class="reg-pro" style="padding: 24px max(24px, 4vw); max-width: 900px; margin: 0 auto;">
<a href="LoginPage.html" class="register-back" style="display:inline-block; margin-bottom: 20px;">← Back to login</a>
<form class="card" onsubmit="handleDoctorRegister(event)">
<h1>Doctor registration</h1>
<p class="banner">Demonstration only. Verification is simulated: new accounts start as Pending and cannot see protected patient records until verified.</p>

<h2>Account information</h2>
<div class="register-grid" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;">
<label class="register-field">Full name<input type="text" id="name" required autocomplete="off" placeholder="Dr. Jane Doe"></label>
<label class="register-field">Email<input type="email" id="email" required autocomplete="off" placeholder="doctor@example.com"></label>
<label class="register-field">Password<input type="password" id="password" required autocomplete="off" minlength="8" placeholder="At least 8 characters"></label>
<label class="register-field">Confirm password<input type="password" id="confirm_password" required autocomplete="off" minlength="8" placeholder="Re-enter password"></label>
</div>

<h2 style="margin-top:24px">Professional details</h2>
<div class="register-grid" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;">
<label class="register-field">NMC registration / license number<input type="text" id="license_number" required autocomplete="off" placeholder="NMC-123456"></label>
<label class="register-field">Medical specialization<input type="text" id="specialization" required autocomplete="off" placeholder="Cardiology"></label>
<label class="register-field">Hospital ID <span class="optional-label">(Optional)</span><input type="number" id="hospital_id" autocomplete="off" placeholder="1"></label>
</div>

<button class="lg btn" style="margin-top:24px; width:100%; justify-content:center;" type="submit">Create account</button>
</form>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
